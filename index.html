<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>paradox//access</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="shell">
  <section class="card">
    <div class="eyebrow">PARADOX</div>
    <h1>paradox//access</h1>
    <p class="sub">Enter your ID or name and password.</p>

    <form id="loginForm" autocomplete="off">
      <label for="identity">ID or name</label>
      <input id="identity" type="text" placeholder="Enter your ID or name" required>

      <label for="password">Password</label>
      <input id="password" type="password" placeholder="Enter your password" required>

      <div class="actions" id="actions">
        <button id="loginButton" type="submit">LOGIN <span>→</span></button>
      </div>

      <div class="message" id="message">The login button is waiting.</div>
    </form>

    <div class="footer">PARADOX / ACCESS DEMO</div>
  </section>
</main>
<script src="script.js"></script>
</body>
</html>
